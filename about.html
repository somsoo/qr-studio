<style>
:root{--ink:#0f172a;--muted:#475569;--accent:#1d4ed8;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;padding:20px 14px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}

<body>
<div class="container">
  <h1>QR 스튜디오 소개</h1>
  <p>웹 주소, 와이파이 접속 정보, 명함(vCard), 일반 텍스트를 담은 QR 코드를 만들어 이미지로 저장하는 무료 도구입니다. 만든 QR 코드는 내용을 그대로 담은 정적 코드라 기한이 없습니다.</p>
  <p>카메라나 사진 속 QR 코드 읽기는 브라우저가 이 기능을 지원할 때만 동작합니다.</p>
