<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이용약관 | QR 스튜디오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased py-12 px-4 sm:px-6">
  <div class="max-w-3xl mx-auto bg-white p-8 sm:p-12 rounded-3xl shadow-sm border border-slate-200">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg">
        <i class="fa-solid fa-qrcode"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black text-slate-900">서비스 이용약관</h1>
        <p class="text-xs text-slate-500">시행일: 2026년 9월 14일</p>
      </div>
    </div>
    
    <div class="space-y-6 text-sm leading-relaxed text-slate-600">
      <h2 class="text-lg font-bold text-slate-800">제1조 (정적 QR 영구 무료성)</h2>
      <p>본 서비스에서 생성된 모든 정적 QR 코드는 서버를 경유하지 않는 독립적인 2차원 바코드이며, 생성 후 수년이 지나도 영구적으로 스캔 작동이 보장됩니다.</p>
      <h2 class="text-lg font-bold text-slate-800">제2조 (PRO 라이선스)</h2>
      <p>비회원 일회성 결제($2.99)로 취득한 라이선스는 최대 3개 기기에서 모든 광고를 영구적으로 제거합니다.</p>
    </div>

    <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center text-xs">
      <a href="./" class="text-emerald-600 font-bold hover:underline">← QR 스튜디오로 돌아가기</a>
      <span class="text-slate-400">© 2026 QR Studio</span>
    </div>
  </div>
</body>
</html>
